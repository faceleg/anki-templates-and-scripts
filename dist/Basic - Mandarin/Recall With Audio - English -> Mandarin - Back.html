  <script>
// AudioManager — speech synthesis (Writing) and playback of the card's
// Audio field inside #audio. Created once: AnkiMobile may reuse the page across cards.
window.AudioManager = window.AudioManager || (function () {
  var _voice = null;
  var _voicesLoaded = false;
  var _pendingPhrase = null;

  function _findVoice() {
    var voices = speechSynthesis.getVoices();
    return (
      voices.find(function (v) {
        return (
          v.lang.indexOf("zh-CN") === 0 &&
          v.name.toLowerCase() === "tingting"
        );
      }) ||
      voices.find(function (v) {
        return v.lang.indexOf("zh") === 0;
      }) ||
      null
    );
  }

  function _loadVoices() {
    _voice = _findVoice();
    _voicesLoaded = true;
  }

  if (speechSynthesis.getVoices().length > 0) {
    _loadVoices();
  } else {
    speechSynthesis.addEventListener("voiceschanged", function onVoicesChanged() {
      _loadVoices();
      speechSynthesis.removeEventListener("voiceschanged", onVoicesChanged);
    });
  }

  function speak(phrase, onEnd) {
    if (!phrase) return;
    if (!_voicesLoaded) {
      _voice = _findVoice();
      _voicesLoaded = true;
    }

    if (speechSynthesis.speaking) {
      _pendingPhrase = { phrase: phrase, onEnd: onEnd };
      return;
    }

    _pendingPhrase = null;
    _doSpeak(phrase, onEnd);
  }

  function _doSpeak(phrase, onEnd) {
    var utterance = new SpeechSynthesisUtterance();
    utterance.rate = 0.5;
    utterance.volume = 0.75;
    utterance.lang = "zh";
    if (_voice) utterance.voice = _voice;
    utterance.text = phrase;
    utterance.onend = function () {
      if (onEnd) onEnd();
      if (_pendingPhrase) {
        var next = _pendingPhrase;
        _pendingPhrase = null;
        _doSpeak(next.phrase, next.onEnd);
      }
    };
    speechSynthesis.speak(utterance);
  }

  function playAnkiAudio() {
    var audioDiv = document.getElementById("audio");
    if (!audioDiv) return;
    var els = audioDiv.getElementsByTagName("*");
    if (!els.length) return;
    els[0].tagName === "AUDIO" ? els[0].play() : els[0].click();
  }

  return { speak: speak, playAnkiAudio: playAnkiAudio };
})();

</script>
  <script>
// Pinyin tone colorization

var TONE_COLORS = {
  1: "#f44336",
  2: "#ff9800",
  3: "#4caf50",
  4: "#2196f3",
  5: document.body.classList.contains("night_mode") ? "#fff" : "#555",
};

function decodePinyin(pinyin) {
  var coreVowels = ["a", "e", "i", "o", "u", "ü", "v"];
  var tonesArr = [];
  var buffer = [];

  function isCore(char, charPrevTwo, charNext) {
    if (
      char === "r" &&
      (charNext === " " || charNext === "") &&
      charPrevTwo !== " " &&
      charPrevTwo !== ""
    ) {
      return [true, true];
    }
    char = char
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase();
    for (var i = 0; i < coreVowels.length; i++) {
      if (char === coreVowels[i]) {
        return [true, false];
      }
    }
    return [false, false];
  }

  function getTone(str) {
    var pure = str.replace(/a|e|i|o|u|ü|r/g, "");
    if (pure === "") {
      return 5;
    } else if (["ā", "ē", "ī", "ō", "ū", "ǖ", "v̄"].indexOf(pure) !== -1) {
      return 1;
    } else if (["á", "é", "í", "ó", "ú", "ǘ", "v́"].indexOf(pure) !== -1) {
      return 2;
    } else if (["ǎ", "ě", "ǐ", "ǒ", "ǔ", "ǚ", "v̌"].indexOf(pure) !== -1) {
      return 3;
    } else if (["à", "è", "ì", "ò", "ù", "ǜ", "v̀"].indexOf(pure) !== -1) {
      return 4;
    } else {
      return 4; // Probably 绿 with v̀
    }
  }

  function flush() {
    if (buffer.length > 0) {
      tonesArr.push(getTone(buffer.join("")));
      buffer = [];
    }
  }

  for (var i = 0; i < pinyin.length; i++) {
    var result = isCore(pinyin[i], pinyin[i - 2], pinyin[i + 1]);
    if (result[1]) {
      flush();
    }
    if (result[0]) {
      buffer.push(pinyin[i]);
    } else {
      flush();
    }
  }

  if (buffer.length > 0) {
    tonesArr.push(getTone(buffer.join("")));
  }

  return tonesArr;
}

function recolorPinyin(pinyinElement, decodedTones) {
  var pinyinText = pinyinElement.textContent.trim();
  var coloredPinyin = "";
  var wordIndex = 0;

  for (var i = 0; i < pinyinText.length; i++) {
    if (pinyinText[i] === " ") {
      coloredPinyin += " ";
      wordIndex++;
      continue;
    }
    var color = TONE_COLORS[decodedTones[wordIndex]] || "#000"; // Default color to black if tone is not found
    coloredPinyin +=
      '<span style="color:' + color + ';">' + pinyinText[i] + "</span>";
  }

  pinyinElement.innerHTML = coloredPinyin;
}

function isChineseCharacter(char) {
  return /^[\u4e00-\u9fff]$/.test(char);
}

function recolorCharacters(characterElement, decodedTones) {
  var characterText = characterElement.innerHTML;
  var coloredCharacters = "";
  var wordIndex = 0;

  for (var i = 0; i < characterText.length; i++) {
    if (!isChineseCharacter(characterText[i])) {
      coloredCharacters += characterText[i];
    } else {
      var color = TONE_COLORS[decodedTones[wordIndex]] || "#555"; // Default color to grey if tone is not found
      coloredCharacters +=
        '<span style="color:' + color + ';">' + characterText[i] + "</span>";
      wordIndex++;
    }
  }

  characterElement.innerHTML = coloredCharacters;
}

function applyColorization() {
  var pinyinElement = document.getElementById("char_pinyin");
  if (!pinyinElement) {
    return;
  }
  var decodedTones = decodePinyin(pinyinElement.textContent);
  recolorPinyin(pinyinElement, decodedTones);

  ["char_sim", "char_sim_coloured", "chinese"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) recolorCharacters(el, decodedTones);
  });
}

applyColorization();

</script>
