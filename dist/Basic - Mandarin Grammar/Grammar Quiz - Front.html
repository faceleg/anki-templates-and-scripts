<!-- Display-only: arrange the tiles mentally, say the sentence aloud, flip, self-grade -->
<div id="split_sent">{{Split}}</div>

<div class="spacer"></div>

<div id="translation" class="translation">{{English}}</div>

<div class="spacer"></div>

<div id="container"></div>

<script>
(function () {
  var words = document.getElementById("split_sent").textContent.trim().split(/\s+/).filter(Boolean);
  var tiles = words.slice();

  // Fisher–Yates; reshuffle if the result is the original order (capped, e.g. "哈 哈")
  for (var attempt = 0; attempt < 10; attempt++) {
    for (var i = tiles.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = tiles[i];
      tiles[i] = tiles[j];
      tiles[j] = t;
    }
    if (tiles.length < 2 || tiles.join(" ") !== words.join(" ")) break;
  }

  var container = document.getElementById("container");
  container.innerHTML = "";
  tiles.forEach(function (word) {
    var tile = document.createElement("div");
    tile.className = "btn-q";
    tile.textContent = word;
    container.appendChild(tile);
  });
})();
</script>
