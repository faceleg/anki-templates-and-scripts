<div id="back">

    <div class="char_img">{{Image}}</div>
    <br>

    <div class="char_meaning">{{English}}</div>
    <br>
    <hr>
    <div id="char_sim_coloured">{{Color}}</div>
    <br >

    <div class="modal-footer1">
        <a class="btn" id="btnShowPinyin" onclick="var el = document.getElementById('char_pinyin'); el.hidden = !el.hidden">
            <div class="icon">
                <i class="material-icons">text_increase</i>
            </div>
        </a>
        <a class="btn" id="btnShowRuby" onclick="var el = document.getElementById('char_reading'); el.hidden = !el.hidden">
            <div class="icon">
                <i class="material-icons">text_rotation_none</i>
            </div>
        </a>
        <a class="btn" id="btnPlayAudio" onclick="AudioManager.playAnkiAudio()">
            <div class="icon">
                <i class="material-icons">play_arrow</i>
            </div>
        </a>
    </div>
    
    <div id="char_pinyin" hidden>
        {{Pinyin}}
    </div>

    <div id="char_reading" hidden>
        <ruby>
            {{Color}}<rt>{{Pinyin}}</rt>
        </ruby>
    </div>

    <div id="char_deck">
        <div>{{Deck}}</div>
        <div>{{Card}}</div>
        <div id="font-name"></div>
        <div id="audio">{{Audio}}</div>
    </div>	
</div>

<script>
// Strip U+200E (left-to-right mark) from the card's text nodes. Runs on render
// (DOMContentLoaded never fires again when the page is reused) and only touches
// text nodes, so nested tone-colour spans survive.
(function () {
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  var node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.indexOf("‎") !== -1) {
      node.nodeValue = node.nodeValue.split("‎").join("");
    }
  }
})();

</script>
<script>
// AudioManager — speech synthesis (Writing) and playback of the card's
// {{Audio}} inside #audio. Created once: AnkiMobile may reuse the page across cards.
window.AudioManager = window.AudioManager || (function () {
  var _voice = null;
  var _voicesLoaded = false;
  var _pendingPhrase = null;

  function _findVoice() {
    var voices = speechSynthesis.getVoices();
    return (
      voices.find(function (v) {
        return (
          v.lang.indexOf("zh-CN") === 0 &&
          v.name.toLowerCase() === "tingting"
        );
      }) ||
      voices.find(function (v) {
        return v.lang.indexOf("zh") === 0;
      }) ||
      null
    );
  }

  function _loadVoices() {
    _voice = _findVoice();
    _voicesLoaded = true;
  }

  if (speechSynthesis.getVoices().length > 0) {
    _loadVoices();
  } else {
    speechSynthesis.addEventListener("voiceschanged", function onVoicesChanged() {
      _loadVoices();
      speechSynthesis.removeEventListener("voiceschanged", onVoicesChanged);
    });
  }

  function speak(phrase, onEnd) {
    if (!phrase) return;
    if (!_voicesLoaded) {
      _voice = _findVoice();
      _voicesLoaded = true;
    }

    if (speechSynthesis.speaking) {
      _pendingPhrase = { phrase: phrase, onEnd: onEnd };
      return;
    }

    _pendingPhrase = null;
    _doSpeak(phrase, onEnd);
  }

  function _doSpeak(phrase, onEnd) {
    var utterance = new SpeechSynthesisUtterance();
    utterance.rate = 0.5;
    utterance.volume = 0.75;
    utterance.lang = "zh";
    if (_voice) utterance.voice = _voice;
    utterance.text = phrase;
    utterance.onend = function () {
      if (onEnd) onEnd();
      if (_pendingPhrase) {
        var next = _pendingPhrase;
        _pendingPhrase = null;
        _doSpeak(next.phrase, next.onEnd);
      }
    };
    speechSynthesis.speak(utterance);
  }

  function playAnkiAudio() {
    var audioDiv = document.getElementById("audio");
    if (!audioDiv) return;
    var els = audioDiv.getElementsByTagName("*");
    if (!els.length) return;
    els[0].tagName === "AUDIO" ? els[0].play() : els[0].click();
  }

  return { speak: speak, playAnkiAudio: playAnkiAudio };
})();

</script>
<script>
// Font rotation: every 3 minutes the Chinese text switches typeface so the reader
// learns several fonts. Class names are spelled out here so PurgeCSS keeps the
// matching rules in character.css. #font-name (on backs) shows the current font.
(function () {
  var FONTS = [
    ["heiti", "Heiti"],
    ["songti", "Songti"],
    ["kaiti", "KaiTi"],
    ["heiti", "Heiti"],
    ["songti", "Songti"],
    ["jason", "Jason Handwriting"],
    ["muyao", "Muyao Handwriting"],
    ["wenkai", "LXGW WenKai"],
  ];
  var font = FONTS[Math.floor(Date.now() / 180000) % FONTS.length];

  ["char_sim", "char_sim_coloured", "char_reading"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    FONTS.forEach(function (f) { el.classList.remove(f[0]); });
    el.classList.add("char-card", font[0]);
  });

  var label = document.getElementById("font-name");
  if (label) label.textContent = font[1];
})();

</script>
