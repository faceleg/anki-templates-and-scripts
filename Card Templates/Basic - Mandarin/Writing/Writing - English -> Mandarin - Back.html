<div id="back">{{FrontSide}}</div>

<script type="text/javascript">
// Auto-play audio on reveal (the front's {{Audio}} is not replayed by Anki on the back)
(function () {
  var audioDiv = document.getElementById("audio");
  if (!audioDiv) return;
  var audioEls = audioDiv.getElementsByTagName("audio");
  if (audioEls.length > 0) {
    audioEls[0].play();
  } else {
    var anyEls = audioDiv.getElementsByTagName("*");
    if (anyEls.length > 0) anyEls[0].click();
  }
})();
</script>
