<div id="char_meaning" class="meaning-card">{{Definitions}}</div>
<!-- @inject: shared/js/strip-meaning-hanzi.js -->
<div id="char_examples_blank" class="recall-example">{{ExamplesBlank}}</div>

<script type="text/javascript">
(function () {
  function showHide(selectors) {
    for (const selector of selectors) {
      const elements = document.querySelectorAll(selector);

      for (const element of elements) {
        element.style.display = "none";
      }
    }
  }

  showHide([".char", ".pinyin", ".zhuyin"]);
})();
</script>
